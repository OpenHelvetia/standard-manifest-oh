[package]
name = "oh-validate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3"
json-ld = "=0.21.4"
jsonschema = "0.49.9"
# default-features = false drops the RocksDB C++ build (oxrocksdb-sys)
# that OOMKilled the CI runner (pipelines #1083/#1084, assignment N);
# stage 4 uses only the in-memory Store, Dataset canonicalization
# (rdfc-10 via oxrdf) and SparqlEvaluator — none of which need it.
oxigraph = { version = "=0.5.9", default-features = false }
rudof_lib = "=0.3.8"
serde_json = "1.0.151"
sha2 = "=0.11.0"
