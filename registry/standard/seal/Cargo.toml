[package]
name = "oh-seal"
version = "0.1.0"
edition = "2024"
description = "Artifact seal gate: byte-drift enforcement over the standard's published artifacts (L0.6)"

[lib]
name = "oh_seal"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact pin, same rationale as the stage-4 fingerprint: the seal hash
# algorithm must never drift silently (tool register).
sha2 = "=0.11.0"
